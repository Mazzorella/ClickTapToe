# ZMK still uses Zephyr's deprecated KSCAN subsystem for keyboard scanning.
CONFIG_WARN_DEPRECATED=n

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300
